[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# index.html คือ Entry Point เดียวของแอป ไม่ต้อง Cache นาน ๆ ฝั่ง CDN
# เพื่อให้ทุกครั้งที่ Deploy ใหม่ ผู้ใช้เห็นโค้ดล่าสุดทันที
# (ข้อมูลแอปเองอยู่ใน Netlify Blobs ฝั่งเซิร์ฟเวอร์ ไม่เกี่ยวกับ Cache นี้)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
